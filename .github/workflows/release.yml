# 打一个 v* 标签即触发：从 CHANGELOG 取发布说明 → 创建 draft release →
# 三平台构建并上传 → 发布。
#
# 需要的仓库 secret：
#   MYGO_UPDATER_PRIVATE_KEY  mygo-update.key 的内容（更新签名的私钥）
# 可选（正式签名用）：
#   MACOS_CERTIFICATE / MACOS_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 draft release 并把构建产物传上去

jobs:
  draft-release:
    name: 创建 draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 发布说明来自 CHANGELOG.md 里 "## <版本号>" 那一节，
      # 而不是 GitHub 自动生成的 What's changed。
      - name: 从 CHANGELOG.md 取发布说明
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v tag="## ${version}" '
            index($0, tag) == 1 { started = 1; next }
            started && /^## / { exit }
            started { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "CHANGELOG.md 缺少 \"## ${version}\" 一节，无法生成发布说明" >&2
            exit 1
          fi
          echo "发布说明："
          cat "${RUNNER_TEMP}/notes.md"

      - name: 创建或更新 draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "${RUNNER_TEMP}/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 检查标签与 mygo.json 的版本是否一致
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"

      # Windows 安装包用 NSIS 生成；在 Linux 上构建 Windows 目标时需要它。
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: 构建并上传
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    needs: build
    name: 发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 再写一次说明：构建上传只加附件，不会动正文，但重跑时保持幂等。
      - name: 校验发布说明仍然存在
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v tag="## ${version}" '
            index($0, tag) == 1 { started = 1; next }
            started && /^## / { exit }
            started { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          test -s "${RUNNER_TEMP}/notes.md"

      - name: 取消 draft 并写入说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes-file "${RUNNER_TEMP}/notes.md" --draft=false
